<text x="547" y="252" font-family="Arial, sans-serif" font-size="17" fill="#087c77" text-anchor="middle" font-weight="400">M = ¬D</text>
<text x="1044" y="277" font-family="Arial, sans-serif" font-size="21" fill="#235ca1" text-anchor="start" font-weight="600">Q</text>
<rect x="40" y="536" width="1040" height="45" rx="0" fill="#eaf0f7" stroke="none"/>
<text x="60" y="565" font-family="Arial, sans-serif" font-size="17" fill="#235ca1" text-anchor="start" font-weight="600">CLOCK PHASE</text>
<text x="320" y="565" font-family="Arial, sans-serif" font-size="17" fill="#235ca1" text-anchor="start" font-weight="600">MASTER</text>
<text x="635" y="565" font-family="Arial, sans-serif" font-size="17" fill="#235ca1" text-anchor="start" font-weight="600">SLAVE</text>
<text x="889" y="565" font-family="Arial, sans-serif" font-size="17" fill="#235ca1" text-anchor="start" font-weight="600">OBSERVE</text>
<text x="60" y="610" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">CLK = 0</text>
<text x="320" y="610" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">Input ON · feedback OFF</text>
<text x="635" y="610" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">Input OFF · feedback ON</text>
<text x="889" y="610" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">Q holds</text>
<text x="60" y="653" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">CLK = 1</text>
<text x="320" y="653" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">Input OFF · feedback ON</text>
<text x="635" y="653" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">Input ON · feedback OFF</text>
<text x="889" y="653" font-family="Arial, sans-serif" font-size="16" fill="#26364a" text-anchor="start" font-weight="400">Q = ¬M</text>
<rect x="40" y="686" width="1040" height="103" rx="8" fill="#eff7f6" stroke="none"/>
<text x="58" y="714" font-family="Arial, sans-serif" font-size="18" fill="#087c77" text-anchor="start" font-weight="600">At the rising edge: the master closes; the slave opens.</text>
<text x="58" y="740" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">The master stores M = ¬D. The slave inverts M again, so Q takes the sampled D value.</text>
<text x="58" y="765" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">TG labels name the actual nMOS and pMOS gate nets. CLK̅ is the complement of CLK; overlap is nonideal.</text>
</svg>