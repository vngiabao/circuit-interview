<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 795" role="img" aria-labelledby="title desc"><title id="title">A positive-edge flip-flop, built from two static TG latches</title><desc id="desc">Each latch has two inverters and complementary input / feedback transmission gates.</desc>
