<text x="644" y="318" font-family="Arial, sans-serif" font-size="18" fill="#a36512" text-anchor="start" font-weight="400">Ik</text>
<polyline points="490,363 490,423" fill="none" stroke="#087c77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="509" y="401" font-family="Arial, sans-serif" font-size="18" fill="#087c77" text-anchor="start" font-weight="400">Icell</text>
<text x="64" y="447" font-family="Arial, sans-serif" font-size="17" fill="#627185" text-anchor="start" font-weight="400">Unselected cells add</text>
<text x="64" y="472" font-family="Arial, sans-serif" font-size="17" fill="#627185" text-anchor="start" font-weight="400">ΣIoff and capacitance.</text>
<rect x="40" y="580" width="504" height="120" rx="8" fill="#edf7f5" stroke="none"/>
<text x="60" y="609" font-family="Arial, sans-serif" font-size="18" fill="#087c77" text-anchor="start" font-weight="600">DISCHARGE / READ ZERO</text>
<text x="60" y="637" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Icell &gt; Ik during the initial contention.</text>
<text x="60" y="664" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">BL crosses VM → Y rises → keeper turns OFF.</text>
<text x="60" y="688" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Approximation: t ≈ CBL · ΔV / (Icell − Ik).</text>
<rect x="562" y="580" width="518" height="120" rx="8" fill="#fff6e1" stroke="none"/>
<text x="582" y="609" font-family="Arial, sans-serif" font-size="18" fill="#a36512" text-anchor="start" font-weight="600">RETAIN HIGH / READ ONE</text>
<text x="582" y="637" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Selected pulldown is absent or inactive.</text>
<text x="582" y="664" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Keeper replenishes the column’s total leakage.</text>
<text x="582" y="688" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Need Ik &gt; ΣIoff with noise / corner margin.</text>
<rect x="40" y="722" width="1040" height="103" rx="8" fill="#eff7f6" stroke="none"/>
<text x="58" y="750" font-family="Arial, sans-serif" font-size="18" fill="#087c77" text-anchor="start" font-weight="600">Sequence: PRE̅ = 0 precharges; PRE̅ = 1 evaluates. Do not fight an enabled precharge.</text>
<text x="58" y="776" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">The inverter illustrates a decision threshold VM. A real ROM may use a separate reference / sense amplifier.</text>
<text x="58" y="801" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Check hold and discharge at their own worst corners. Constant-current timing is only a first-order estimate.</text>
</svg>