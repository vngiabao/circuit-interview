<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc"><title id="title">A precharged ROM bitline is a current competition</title><desc id="desc">Read-zero convention here means BL discharges. The shown inverter output Y has the opposite polarity.</desc>
