<rect x="40" y="578" width="1040" height="89" rx="8" fill="#fff5df" stroke="none"/>
<text x="59" y="607" font-family="Arial, sans-serif" font-size="18" fill="#a36512" text-anchor="start" font-weight="600">READ DISTURB</text>
<text x="59" y="634" font-family="Arial, sans-serif" font-size="18" fill="#26364a" text-anchor="start" font-weight="400">BL → access nMOS → Q → pull-down nMOS → ground. Q rises slightly above 0.</text>
<text x="59" y="657" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">The pull-down must keep that bump below the opposite inverter’s trip region.</text>
<rect x="40" y="688" width="1040" height="128" rx="8" fill="#eff7f6" stroke="none"/>
<text x="58" y="716" font-family="Arial, sans-serif" font-size="18" fill="#087c77" text-anchor="start" font-weight="600">The two gates labeled Q connect to node Q; the two gates labeled Q̅ connect to Q̅.</text>
<text x="58" y="742" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Named nets provide cross-coupling; the bridged crossing is not a junction. Six transistors store and access one bit.</text>
<text x="58" y="767" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">Read sizing: strengthen PD relative to AX. Write sizing: AX must still overcome the opposing PU.</text>
<text x="58" y="792" font-family="Arial, sans-serif" font-size="17" fill="#26364a" text-anchor="start" font-weight="400">This topology explains the tradeoff; read SNM and write margin must be measured across PVT and mismatch.</text>
</svg>