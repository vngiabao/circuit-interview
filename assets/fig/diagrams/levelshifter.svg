L)</text><path d='M534 205 L580 205' fill='none' stroke='#4a5568' stroke-width='1.6'/><text x='588' y='209' font-size='12' font-weight='700' fill='#d9822b' text-anchor='start'>Ā (0…VDDL)</text><text x='380' y='290' font-size='12' font-weight='600' fill='#1c2129' text-anchor='middle'>A rises → N1 must overpower P1 (contention) → X falls → P2 on → X̄ = VDDH</text><text x='380' y='308' font-size='11' font-weight='400' fill='#c0392b' text-anchor='middle'>Low VDDL: N1 too weak to win → stuck.  VDDL off: inputs undefined → use an isolation cell.</text></svg>