<svg viewBox='0 0 760 382' xmlns='http://www.w3.org/2000/svg' font-family='Inter, sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4a5568'/></marker></defs><rect x='22' y='28' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='102.0' y='56' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>0. Spec & contract</text><path d='M182 51.0 L208 51.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><rect x='208' y='28' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='288.0' y='56' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>1. Baseline (reproduce ref)</text><path d='M368 51.0 L394 51.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><rect x='394' y='28' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='474.0' y='56' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>2. Topology & sizing</text><path d='M554 51.0 L580 51.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><rect x='580' y='28' width='160' height='46' rx='8' fill='#e3ecf8' stroke='#2f6db5' stroke-width='2'/><text x='660.0' y='56' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>3. Pre-layout SPICE</text><text x='660.0' y='91' font-size='10' font-weight='700' fill='#c0392b' text-anchor='middle'>✗ → back to 2</text><path d='M660.0 100 L660.0 112 L102.0 112 L102.0 140' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><rect x='22' y='140' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='102.0' y='168' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>4. Layout (co-design)</text><path d='M182 163.0 L208 163.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><rect x='208' y='140' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='288.0' y='168' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>5. DRC / LVS in context</text><path d='M368 163.0 L394 163.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><text x='288.0' y='203' font-size='10' font-weight='700' fill='#c0392b' text-anchor='middle'>✗ → back to 4</text><rect x='394' y='140' width='160' height='46' rx='8' fill='#e3ecf8' stroke='#2f6db5' stroke-width='2'/><text x='474.0' y='168' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>6. Post-layout sim</text><path d='M554 163.0 L580 163.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><text x='474.0' y='203' font-size='10' font-weight='700' fill='#c0392b' text-anchor='middle'>✗ → back to 4 or 2</text><rect x='580' y='140' width='160' height='46' rx='8' fill='#e3ecf8' stroke='#2f6db5' stroke-width='2'/><text x='660.0' y='168' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>7. EM / IR / aging / σ</text><text x='660.0' y='203' font-size='10' font-weight='700' fill='#c0392b' text-anchor='middle'>✗ → 4, 2 or limit in .lib</text><path d='M660.0 212 L660.0 224 L102.0 224 L102.0 252' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><rect x='22' y='252' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='102.0' y='280' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>8. Characterize .lib</text><path d='M182 275.0 L208 275.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><rect x='208' y='252' width='160' height='46' rx='8' fill='#e3ecf8' stroke='#2f6db5' stroke-width='2'/><text x='288.0' y='280' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>9. Library QA</text><path d='M368 275.0 L394 275.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><text x='288.0' y='315' font-size='10' font-weight='700' fill='#c0392b' text-anchor='middle'>✗ → back to 8</text><rect x='394' y='252' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='474.0' y='280' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>10. Trial integration</text><path d='M554 275.0 L580 275.0' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><text x='474.0' y='315' font-size='10' font-weight='700' fill='#c0392b' text-anchor='middle'>✗ → 4 (pins) or 9</text><rect x='580' y='252' width='160' height='46' rx='8' fill='#f3f5f8' stroke='#4a5568' stroke-width='1.3'/><text x='660.0' y='280' font-size='10.5' font-weight='700' fill='#1c2129' text-anchor='middle'>11. Release → silicon</text><text x='660.0' y='315' font-size='10' font-weight='700' fill='#c0392b' text-anchor='middle'>silicon off → re-char / fix</text><text x='380' y='372' font-size='11' font-weight='600' fill='#2f6db5' text-anchor='middle'>Blue = the gates where most cells fail. Every ✗ loops back; fix it at the cheapest stage.</text></svg>