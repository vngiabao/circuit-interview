<svg viewBox='0 0 760 235' xmlns='http://www.w3.org/2000/svg' font-family='Inter, sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4a5568'/></marker></defs><rect x='140' y='60' width='150' height='80' rx='8' fill='#e3ecf8' stroke='#2f6db5' stroke-width='1.5'/><text x='215' y='95' font-size='13' font-weight='700' fill='#2f6db5' text-anchor='middle'>LATCH</text><text x='215' y='115' font-size='10' font-weight='400' fill='#5b6573' text-anchor='middle'>open when CLK = 0</text><path d='M60 85 L140 85' fill='none' stroke='#4a5568' stroke-width='1.6'/><text x='52' y='89' font-size='12' font-weight='700' fill='#1c2129' text-anchor='end'>EN</text><path d='M60 125 L140 125' fill='none' stroke='#4a5568' stroke-width='1.6'/><text x='52' y='129' font-size='12' font-weight='700' fill='#1c2129' text-anchor='end'>CLK̄</text><path d='M380 70 L410 70 A40 40 0 0 1 410 150 L380 150 Z' fill='white' stroke='#4a5568' stroke-width='1.6'/><path d='M290 100 L380 100' fill='none' stroke='#4a5568' stroke-width='1.6'/><text x='335' y='92' font-size='10' font-weight='400' fill='#5b6573' text-anchor='middle'>EN_latched</text><path d='M330 185 L330 125 L380 125' fill='none' stroke='#4a5568' stroke-width='1.6'/><path d='M60 185 L330 185' fill='none' stroke='#4a5568' stroke-width='1.6'/><text x='52' y='189' font-size='12' font-weight='700' fill='#1c2129' text-anchor='end'>CLK</text><path d='M450 110 L540 110' fill='none' stroke='#4a5568' stroke-width='1.6' marker-end='url(#ah)'/><text x='548' y='114' font-size='13' font-weight='700' fill='#2e8b57' text-anchor='start'>GCLK</text><text x='380' y='222' font-size='12' font-weight='600' fill='#1c2129' text-anchor='middle'>The latch freezes EN while CLK is high → no glitches or runt pulses on GCLK</text></svg>